<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GBN — Gunpla Battle Nexus</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    :root {
        --void: #04070c;
        --void-2: #070d16;
        --cyan: #4de3ff;
        --cyan-dim: rgba(77, 227, 255, 0.35);
        --amber: #ffb43d;
        --panel: rgba(9, 20, 32, 0.86);
        --hairline: rgba(120, 200, 230, 0.16);
        --muted: #6f8ea3;
        --text: #eaf6fb;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--void);
        font-family: 'Rajdhani', sans-serif;
        color: var(--text);
        overflow: hidden;
        position: relative;
    }

    /* ---------- Backdrop: dive-space field ---------- */
    .backdrop {
        position: absolute;
        inset: 0;
        background:
            radial-gradient(ellipse 900px 600px at 50% 15%, rgba(77, 227, 255, 0.10), transparent 65%),
            radial-gradient(ellipse 700px 500px at 85% 85%, rgba(255, 180, 61, 0.06), transparent 60%),
            var(--void-2);
    }

    .scanfield {
        position: absolute;
        inset: -10%;
        background-image:
            linear-gradient(rgba(77, 227, 255, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(77, 227, 255, 0.05) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 75%);
        animation: drift 34s linear infinite;
    }
    @keyframes drift {
        from { transform: translate(0, 0); }
        to   { transform: translate(-44px, -44px); }
    }

    .particle {
        position: absolute;
        width: 2px; height: 2px;
        background: var(--cyan);
        border-radius: 50%;
        box-shadow: 0 0 6px var(--cyan);
        opacity: 0.6;
        animation: rise linear infinite;
    }
    @keyframes rise {
        from { transform: translateY(0); opacity: 0; }
        10%  { opacity: 0.7; }
        90%  { opacity: 0.3; }
        to   { transform: translateY(-100vh); opacity: 0; }
    }

    /* ---------- Boot sequence (replaces the old two-door gate) ---------- */
    .boot {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: var(--void);
        transition: opacity 0.7s ease, visibility 0.7s ease;
    }
    .boot.done { opacity: 0; visibility: hidden; pointer-events: none; }

    .boot-mark {
        font-family: 'Orbitron', sans-serif;
        font-weight: 900;
        font-size: 2.2rem;
        letter-spacing: 6px;
        color: var(--cyan);
        text-shadow: 0 0 24px var(--cyan-dim);
        margin-bottom: 22px;
    }

    .boot-line {
        font-size: 0.8rem;
        letter-spacing: 3px;
        color: var(--muted);
        margin-bottom: 16px;
        min-height: 1.2em;
    }

    .boot-track {
        width: 240px;
        height: 3px;
        background: rgba(255,255,255,0.08);
        position: relative;
        overflow: hidden;
    }
    .boot-fill {
        position: absolute;
        left: 0; top: 0;
        height: 100%;
        width: 0%;
        background: var(--cyan);
        box-shadow: 0 0 10px var(--cyan);
        transition: width 0.12s linear;
    }

    /* ---------- Main terminal panel ---------- */
    .terminal {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 420px;
        margin: 20px;
        opacity: 0;
        transform: translateY(14px);
        transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .terminal.in {
        opacity: 1;
        transform: translateY(0);
    }

    .panel {
        position: relative;
        background: var(--panel);
        backdrop-filter: blur(18px);
        border: 1px solid var(--hairline);
        padding: 38px 32px 26px;
        clip-path: polygon(
            0 18px, 18px 0,
            calc(100% - 40px) 0, 100% 40px,
            100% 100%,
            22px 100%, 0 calc(100% - 22px)
        );
    }

    .panel::before {
        content: '';
        position: absolute;
        top: 0; right: 0;
        width: 40px; height: 40px;
        border-left: 1px solid var(--cyan-dim);
        border-bottom: 1px solid var(--cyan-dim);
        opacity: 0.6;
    }

    .rank-tag {
        position: absolute;
        top: 12px;
        right: 14px;
        font-family: 'Orbitron', sans-serif;
        font-size: 0.55rem;
        letter-spacing: 2px;
        color: var(--amber);
    }

    /* ---------- Header / wordmark ---------- */
    .brand {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 4px;
    }

    .brand-mark {
        font-family: 'Orbitron', sans-serif;
        font-weight: 900;
        font-size: 2.6rem;
        letter-spacing: 2px;
        color: var(--text);
        text-shadow: 0 0 20px var(--cyan-dim);
        line-height: 1;
    }
    .brand-mark span { color: var(--cyan); }

    .brand-line {
        font-size: 0.72rem;
        color: var(--muted);
        letter-spacing: 2px;
        margin-bottom: 26px;
    }
    .brand-line b { color: var(--cyan); font-weight: 600; }

    /* ---------- Input ---------- */
    .field-label {
        display: block;
        font-size: 0.7rem;
        color: var(--muted);
        letter-spacing: 1.5px;
        margin-bottom: 8px;
    }

    .field-wrap {
        display: flex;
        align-items: stretch;
        border: 1px solid var(--hairline);
        background: rgba(0,0,0,0.35);
        transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .field-wrap:focus-within {
        border-color: var(--cyan);
        box-shadow: 0 0 0 1px var(--cyan-dim), 0 0 18px var(--cyan-dim);
    }

    .field-chip {
        display: flex;
        align-items: center;
        padding: 0 12px;
        font-family: 'Orbitron', sans-serif;
        font-size: 0.68rem;
        letter-spacing: 1px;
        color: var(--muted);
        border-right: 1px solid var(--hairline);
        white-space: nowrap;
    }

    .code-input {
        flex: 1;
        min-width: 0;
        padding: 13px 14px;
        background: transparent;
        border: none;
        outline: none;
        color: var(--cyan);
        font-family: 'Orbitron', monospace;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
    }
    .code-input::placeholder {
        color: rgba(234, 246, 251, 0.18);
        font-family: 'Rajdhani', sans-serif;
        font-weight: 500;
        letter-spacing: 1px;
        font-size: 0.9rem;
    }

    .helper {
        font-size: 0.68rem;
        color: var(--muted);
        margin-top: 8px;
        opacity: 0.75;
    }

    /* ---------- Submit ---------- */
    .btn-dive {
        width: 100%;
        margin-top: 22px;
        padding: 14px;
        background: transparent;
        border: 1px solid var(--cyan);
        color: var(--cyan);
        font-family: 'Orbitron', sans-serif;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 2.5px;
        cursor: pointer;
        position: relative;
        clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        transition: color 0.3s ease, box-shadow 0.3s ease;
        overflow: hidden;
    }
    .btn-dive::before {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--cyan);
        transform: translateX(-100%);
        transition: transform 0.3s ease;
        z-index: -1;
    }
    .btn-dive:hover::before { transform: translateX(0); }
    .btn-dive:hover {
        color: var(--void);
        box-shadow: 0 0 22px var(--cyan-dim);
    }
    .btn-dive:disabled {
        opacity: 0.55;
        cursor: wait;
    }

    /* ---------- Result panel ---------- */
    .result {
        display: none;
        margin-top: 20px;
        border-top: 1px solid var(--hairline);
        padding-top: 18px;
        animation: reveal 0.35s ease;
    }
    .result.show { display: block; }

    @keyframes reveal {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .result-eyebrow {
        font-size: 0.65rem;
        color: var(--amber);
        letter-spacing: 2px;
        margin-bottom: 6px;
    }

    .result-name {
        font-family: 'Orbitron', sans-serif;
        font-size: 1.05rem;
        color: var(--cyan);
        margin-bottom: 8px;
    }

    .result-desc {
        font-size: 0.92rem;
        line-height: 1.5;
        color: #c7dbe6;
        margin-bottom: 16px;
    }

    .btn-footage {
        display: block;
        width: 100%;
        padding: 11px;
        text-align: center;
        background: var(--cyan);
        color: var(--void);
        text-decoration: none;
        font-family: 'Orbitron', sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 1.5px;
        transition: filter 0.2s ease;
    }
    .btn-footage:hover { filter: brightness(1.15); }

    .error-line {
        display: none;
        margin-top: 14px;
        font-size: 0.82rem;
        color: #ff8a7a;
        border-left: 2px solid #ff8a7a;
        padding-left: 10px;
        line-height: 1.4;
    }
    .error-line.show { display: block; animation: reveal 0.3s ease; }

    /* ---------- Footer status ---------- */
    .status-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 24px;
        padding-top: 14px;
        border-top: 1px solid var(--hairline);
        font-size: 0.62rem;
        color: var(--muted);
        letter-spacing: 1px;
    }
    .status-live {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--cyan);
    }
    .dot {
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--cyan);
        box-shadow: 0 0 6px var(--cyan);
        animation: blink 1.6s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

    @media (prefers-reduced-motion: reduce) {
        .scanfield, .particle, .dot { animation: none; }
    }
</style>
</head>
<body>

<div class="backdrop"></div>
<div class="scanfield"></div>
<div id="particles"></div>

<!-- Boot sequence -->
<div class="boot" id="boot">
    <div class="boot-mark">GBN</div>
    <div class="boot-line" id="bootLine">ESTABLISHING NEXUS LINK</div>
    <div class="boot-track"><div class="boot-fill" id="bootFill"></div></div>
</div>

<!-- Terminal -->
<div class="terminal" id="terminal">
    <div class="panel">
        <div class="rank-tag">DIVER TERMINAL</div>

        <div class="brand">
            <div class="brand-mark">G<span>B</span>N</div>
        </div>
        <div class="brand-line">GUNPLA BATTLE <b>NEXUS</b> ONLINE</div>

        <form id="nexusForm" autocomplete="off">
            <label class="field-label" for="codeInput">MÃ TRUY CẬP GUNDAM</label>
            <div class="field-wrap">
                <span class="field-chip">GDM</span>
                <input
                    type="text"
                    id="codeInput"
                    class="code-input"
                    placeholder="0000"
                    maxlength="16"
                    autocomplete="off"
                    required
                >
            </div>
            <div class="helper">Nhập mã trên thẻ Legendary Card của bạn</div>

            <button type="submit" class="btn-dive" id="btnSubmit">KẾT NỐI NEXUS</button>
        </form>

        <div class="error-line" id="errorLine"></div>

        <div class="result" id="resultBox">
            <div class="result-eyebrow">DỮ LIỆU ĐÃ GIẢI MÃ</div>
            <div class="result-name" id="resName">--</div>
            <div class="result-desc" id="resDesc">--</div>
            <a href="#" id="resLink" class="btn-footage" target="_blank" rel="noopener">XEM TRẬN CHIẾN</a>
        </div>

        <div class="status-row">
            <span>NEXUS BUILD 2.5.0</span>
            <div class="status-live"><span class="dot"></span> LINK ACTIVE</div>
        </div>
    </div>
</div>

<script>
    // ---- floating particles ----
    const pField = document.getElementById('particles');
    for (let i = 0; i < 24; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.top = Math.random() * 100 + 'vh';
        p.style.animationDuration = (8 + Math.random() * 12) + 's';
        p.style.animationDelay = (Math.random() * 10) + 's';
        pField.appendChild(p);
    }

    // ---- boot sequence ----
    const bootLines = [
        'ESTABLISHING NEXUS LINK',
        'SYNCING GUNPLA DATABASE',
        'CALIBRATING DIVE INTERFACE',
        'LINK READY'
    ];
    const bootEl = document.getElementById('boot');
    const bootFill = document.getElementById('bootFill');
    const bootLine = document.getElementById('bootLine');
    const terminal = document.getElementById('terminal');

    let progress = 0;
    let lineIdx = 0;
    const bootTimer = setInterval(() => {
        progress += Math.floor(Math.random() * 9) + 5;
        if (progress >= 100) {
            progress = 100;
            clearInterval(bootTimer);
            bootLine.innerText = bootLines[bootLines.length - 1];
            setTimeout(() => {
                bootEl.classList.add('done');
                terminal.classList.add('in');
            }, 300);
        } else {
            const nextIdx = Math.min(Math.floor(progress / 26), bootLines.length - 2);
            if (nextIdx !== lineIdx) {
                lineIdx = nextIdx;
                bootLine.innerText = bootLines[lineIdx];
            }
        }
        bootFill.style.width = progress + '%';
    }, 90);

    // ---- form logic ----
    const input = document.getElementById('codeInput');
    const form = document.getElementById('nexusForm');
    const btn = document.getElementById('btnSubmit');
    const resultBox = document.getElementById('resultBox');
    const errorLine = document.getElementById('errorLine');
    const resName = document.getElementById('resName');
    const resDesc = document.getElementById('resDesc');
    const resLink = document.getElementById('resLink');

    input.addEventListener('input', (e) => {
        e.target.value = e.target.value.toUpperCase();
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const code = input.value.trim();
        if (!code) return;

        btn.disabled = true;
        btn.innerText = 'ĐANG XÁC THỰC...';
        resultBox.classList.remove('show');
        errorLine.classList.remove('show');

        try {
            const response = await fetch('/api/verify-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code })
            });
            const result = await response.json();

            if (response.ok && result.status === 'success') {
                btn.innerText = 'ĐÃ KẾT NỐI';
                resName.innerText = `[${result.data.id}] ${result.data.name}`;
                resDesc.innerText = result.data.description;
                resLink.href = result.data.video_url;
                resultBox.classList.add('show');
            } else {
                errorLine.innerText = result.message || 'Mã truy cập không hợp lệ.';
                errorLine.classList.add('show');
                btn.innerText = 'KẾT NỐI NEXUS';
            }
        } catch (err) {
            errorLine.innerText = 'LỖI KẾT NỐI — không thể liên lạc với máy chủ Nexus.';
            errorLine.classList.add('show');
            btn.innerText = 'KẾT NỐI NEXUS';
        } finally {
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
