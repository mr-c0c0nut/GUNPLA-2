<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBN - Gunpla Battle Nexus Online</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00ffaa;
            --primary-glow: rgba(0, 255, 170, 0.4);
            --bg-dark: #040910;
            --card-bg: rgba(6, 18, 28, 0.65);
            --border-color: rgba(0, 255, 170, 0.3);
            --text-dim: #7a9bb0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-dark);
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            position: relative;
            color: #fff;
        }

        /* Nền vũ trụ tĩnh + Lưới Trọng lực (Grid) */
        .bg-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(rgba(0, 255, 170, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 170, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px);
            animation: gridMove 20s linear infinite;
            z-index: 1;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
        }

        /* Ambient Light Center */
        .glow-core {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            z-index: 2;
            filter: blur(40px);
            opacity: 0.6;
        }

        /* Card HUD trung tâm */
        .hud-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 45px 35px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            /* Cắt góc kiểu Sci-Fi */
            clip-path: polygon(
                0 15px, 15px 0, 
                calc(100% - 15px) 0, 100% 15px, 
                100% calc(100% - 15px), calc(100% - 15px) 100%, 
                15px 100%, 0 calc(100% - 15px)
            );
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        /* Trang trí góc HUD */
        .hud-corner {
            position: absolute;
            width: 8px;
            height: 8px;
            border: 2px solid var(--primary);
        }
        .top-left { top: 4px; left: 4px; border-right: none; border-bottom: none; }
        .top-right { top: 4px; right: 4px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 4px; left: 4px; border-right: none; border-top: none; }
        .bottom-right { bottom: 4px; right: 4px; border-left: none; border-top: none; }

        /* Logo GBN Metal & Glow */
        .logo-box {
            margin-bottom: 30px;
        }

        .logo-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 4.5rem;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #ffffff 30%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 12px var(--primary-glow));
            line-height: 0.9;
        }

        .logo-sub {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 5px;
            color: #fff;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .logo-desc {
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: var(--primary);
            opacity: 0.8;
            margin-top: 3px;
        }

        /* Form nhập Code */
        .input-group {
            position: relative;
            margin-top: 30px;
            margin-bottom: 25px;
        }

        .input-label {
            display: block;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: var(--text-dim);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .hud-input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 255, 170, 0.2);
            color: var(--primary);
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 3px;
            outline: none;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .hud-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
            background: rgba(0, 15, 10, 0.7);
        }

        .hud-input::placeholder {
            color: rgba(255, 255, 255, 0.15);
            font-weight: 400;
            letter-spacing: 1px;
            font-family: 'Rajdhani', sans-serif;
        }

        /* Nút Bấm Login */
        .btn-nexus {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        .btn-nexus::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--primary);
            transition: all 0.3s ease;
            z-index: -1;
        }

        .btn-nexus:hover {
            color: #040910;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .btn-nexus:hover::before {
            left: 0;
        }

        .btn-nexus:active {
            transform: scale(0.98);
        }

        /* Trạng thái System Status */
        .sys-status {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.65rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .status-online {
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--primary);
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <!-- Hiệu ứng Nền Grid & Tâm Sáng -->
    <div class="bg-grid"></div>
    <div class="glow-core"></div>

    <!-- HUD Container -->
    <div class="hud-card">
        <!-- Chi tiết góc HUD -->
        <div class="hud-corner top-left"></div>
        <div class="hud-corner top-right"></div>
        <div class="hud-corner bottom-left"></div>
        <div class="hud-corner bottom-right"></div>

        <!-- Header / Logo -->
        <div class="logo-box">
            <h1 class="logo-title">GBN</h1>
            <div class="logo-sub">Gunpla Battle</div>
            <div class="logo-desc">NEXUS ONLINE</div>
        </div>

        <!-- Form nhập Access Code -->
        <form id="nexusForm">
            <div class="input-group">
                <label for="codeInput" class="input-label">System Access Code</label>
                <input 
                    type="text" 
                    id="codeInput" 
                    class="hud-input" 
                    placeholder="ENTER CODE..." 
                    maxlength="16"
                    autocomplete="off"
                    required
                >
            </div>

            <button type="submit" class="btn-nexus" id="btnSubmit">
                CONNECT TO NEXUS
            </button>
        </form>

        <!-- System Footer -->
        <div class="sys-status">
            <span>SYS.VER 2.0.4</span>
            <div class="status-online">
                <span class="dot"></span> NEXUS LINK ONLINE
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById('codeInput');
        const form = document.getElementById('nexusForm');
        const btn = document.getElementById('btnSubmit');

        // Tự động viết hoa mã nhập vào
        input.addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase();
        });

        // Xử lý sự kiện khi ấn kết nối
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const code = input.value.trim();
            
            if (code) {
                btn.innerText = "AUTHENTICATING...";
                btn.style.opacity = "0.7";
                
                setTimeout(() => {
                    alert(`[NEXUS CONNECTED]\nMã xác thực: ${code}\nĐang chuyển hướng vào hệ thống GBN...`);
                    btn.innerText = "CONNECT TO NEXUS";
                    btn.style.opacity = "1";
                }, 1000);
            }
        });
    </script>
</body>
</html>
