<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBN - Gunpla Battle Nexus Online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gbn-green: #2bf0a5;
            --gbn-green-dark: #007a4d;
            --gbn-bg-dark: #030814;
            --glass-bg: rgba(10, 25, 20, 0.4);
            --glass-border: rgba(43, 240, 165, 0.25);
            --glass-glow: rgba(43, 240, 165, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--gbn-bg-dark);
            overflow: hidden;
            position: relative;
            color: #ffffff;
        }

        /* Hiệu ứng nền vũ trụ Sci-Fi */
        .space-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 50% 30%, rgba(13, 71, 57, 0.5) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(10, 40, 70, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at center, #0a1826 0%, #02060d 100%);
            z-index: 1;
        }

        /* Các hạt sáng nền (Glow Particles) */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, rgba(255, 255, 255, 0.8), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, var(--gbn-green), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, var(--gbn-green), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.6;
            animation: starsMove 60s linear infinite;
            z-index: 2;
        }

        @keyframes starsMove {
            0% { background-position: 0 0; }
            100% { background-position: 1000px 500px; }
        }

        /* Card trung tâm Glassmorphism */
        .main-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            padding: 40px 30px;
            margin: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        0 0 30px var(--glass-glow);
            text-align: center;
            transition: all 0.3s ease;
        }

        /* Logo GBN góc cạnh hiện đại */
        .logo-wrapper {
            margin-bottom: 25px;
        }

        .gbn-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #ffffff 0%, var(--gbn-green) 50%, #10a368 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(43, 240, 165, 0.4);
            line-height: 1;
            margin-bottom: 8px;
        }

        .gbn-subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 6px;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
        }

        .gbn-subtext {
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: var(--gbn-green);
            opacity: 0.9;
            margin-top: 4px;
        }

        /* Khu vực nhập Code */
        .code-section {
            margin-top: 35px;
        }

        .input-label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 12px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .code-input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            color: #ffffff;
            text-align: center;
            letter-spacing: 4px;
            outline: none;
            transition: all 0.3s ease;
        }

        .code-input::placeholder {
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 2px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
        }

        .code-input:focus {
            border-color: var(--gbn-green);
            box-shadow: 0 0 15px rgba(43, 240, 165, 0.3);
            background: rgba(0, 0, 0, 0.6);
        }

        /* Nút xác nhận */
        .btn-submit {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--gbn-green) 0%, #13a86c 100%);
            color: #030814;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(43, 240, 165, 0.25);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(43, 240, 165, 0.4);
            filter: brightness(1.1);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Vệt sáng trang trí ở viền dưới */
        .bottom-glow {
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gbn-green), transparent);
            box-shadow: 0 0 10px var(--gbn-green);
        }
    </style>
</head>
<body>

    <div class="space-bg"></div>
    <div class="stars"></div>

    <div class="main-container">
        <div class="logo-wrapper">
            <h1 class="gbn-logo">GBN</h1>
            <div class="gbn-subtitle">GUNPLA BATTLE</div>
            <div class="gbn-subtext">NEXUS ONLINE</div>
        </div>

        <form class="code-section" id="accessForm">
            <label for="accessCode" class="input-label">Nhập Mã Truy Cập</label>
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="accessCode" 
                    class="code-input" 
                    placeholder="ENTER CODE..." 
                    autocomplete="off" 
                    maxlength="12"
                    required
                >
            </div>
            <button type="submit" class="btn-submit">DIVE INTO NEXUS</button>
        </form>

        <div class="bottom-glow"></div>
    </div>

    <script>
        // Xử lý sự kiện gửi form đơn giản
        document.getElementById('accessForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const code = document.getElementById('accessCode').value.trim();
            if(code) {
                // Xử lý logic mã truy cập tại đây
                alert('Đang kết nối tới hệ thống GBN với mã: ' + code);
            }
        });
    </script>
</body>
</html>
